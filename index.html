<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TrashBridge — from scrap to certified recycling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:            #131c17;
  --bg-raise:      #1a2620;
  --panel:         #1e2b23;
  --panel-2:       #25352b;
  --line:          #33453a;
  --trace:         #6fbf7c;
  --trace-dim:     #365a41;
  --brass:         #cd9f45;
  --brass-dim:     #7a6531;
  --rust:          #de7452;
  --rust-dim:      #5a3527;
  --text:          #f2eee2;
  --text-dim:      #a9b7ac;
  --text-faint:    #6d7d72;
  --radius-card:   3px;
  --radius-pill:   999px;
  --font-head: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 15% 0%, #1a2921 0%, transparent 45%),
    radial-gradient(circle at 100% 100%, #17231d 0%, transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--brass); color:#14201b; }
a{color:inherit}
button{font-family:inherit}
:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

/* faint circuit-trace background texture on the shell */
.traces{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(circle at 50% 20%, black, transparent 70%);
}

/* ============================= SHELL ============================= */
.shell{ position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:22px 20px 60px; }

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  margin-bottom:26px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:34px; height:34px; border-radius:8px;
  background:linear-gradient(155deg, var(--trace) 0%, var(--brass) 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-weight:700; color:#0f1712; font-size:16px;
}
.brand-name{ font-family:var(--font-head); font-weight:600; font-size:19px; letter-spacing:.2px; }
.brand-sub{ color:var(--text-faint); font-size:12px; margin-top:1px; }

.persona-switch{
  display:flex; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-pill);
  padding:3px; gap:2px;
}
.persona-switch button{
  border:none; background:transparent; color:var(--text-dim); padding:8px 16px;
  border-radius:var(--radius-pill); font-size:13px; font-weight:600; cursor:pointer;
  transition:background .18s ease, color .18s ease;
}
.persona-switch button.active{ background:var(--brass); color:#1b1409; }
.persona-switch button:not(.active):hover{ color:var(--text); }

/* ============================= PHONE FRAME (collector) ============================= */
.stage{ display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
.phone{
  width:380px; min-height:760px; background:var(--bg-raise); border:1px solid var(--line);
  border-radius:34px; padding:14px; box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  position:relative; flex-shrink:0;
}
.phone-notch{
  width:110px; height:18px; background:var(--bg); border-radius:0 0 14px 14px;
  margin:0 auto 6px;
}
.phone-screen{
  background:var(--bg); border-radius:22px; overflow:hidden; min-height:700px;
  display:flex; flex-direction:column; position:relative;
}
.screen-scroll{ flex:1; overflow-y:auto; padding:18px 16px 90px; }
.screen-scroll::-webkit-scrollbar{ width:0; }

/* status / sync bar */
.syncbar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 14px; font-size:11.5px; color:var(--text-dim); border-bottom:1px solid var(--line);
  background:var(--panel);
}
.syncbar .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
.sync-offline .dot{ background:#e0b94f; box-shadow:0 0 0 3px rgba(224,185,79,.18);}
.sync-syncing .dot{ background:#5fa9e0; box-shadow:0 0 0 3px rgba(95,169,224,.18); animation:pulse 1s infinite; }
.sync-online .dot{ background:var(--trace); box-shadow:0 0 0 3px rgba(111,191,124,.18);}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
.netToggle{
  border:1px solid var(--line); background:transparent; color:var(--text-faint);
  font-size:10.5px; padding:3px 9px; border-radius:var(--radius-pill); cursor:pointer;
}
.netToggle:hover{ color:var(--text); border-color:var(--brass-dim); }

/* bottom tab bar */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; display:flex; background:var(--panel);
  border-top:1px solid var(--line); padding:8px 6px 12px;
}
.tabbar button{
  flex:1; background:none; border:none; color:var(--text-faint); font-size:10px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:4px 2px;
}
.tabbar button .ic{ font-size:17px; }
.tabbar button.active{ color:var(--brass); }

/* ============================= TYPE ============================= */
h1,h2,h3{ font-family:var(--font-head); font-weight:600; margin:0; }
.scr-title{ font-size:21px; margin-bottom:4px; }
.scr-sub{ color:var(--text-dim); font-size:13px; margin-bottom:20px; line-height:1.5; }
.eyebrow{ color:var(--text-faint); font-size:11px; margin-bottom:6px; }
p{ line-height:1.55; }

/* ============================= COMPONENTS ============================= */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
.field input, .field select{
  width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:12px 13px; border-radius:var(--radius-card); font-size:14.5px; font-family:inherit;
}
.field input:focus, .field select:focus{ border-color:var(--brass-dim); }

.lang-row{ display:flex; gap:8px; }
.lang-row button{
  flex:1; padding:11px 6px; border-radius:var(--radius-card); border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-size:13px; cursor:pointer;
}
.lang-row button.active{ border-color:var(--brass); color:var(--brass); background:rgba(205,159,69,.08); }

.btn{
  width:100%; padding:13px 16px; border-radius:var(--radius-card); border:none; cursor:pointer;
  font-family:var(--font-body); font-weight:600; font-size:14.5px; letter-spacing:.1px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{ transform:scale(.98); }
.btn-primary{ background:linear-gradient(155deg, #e0b45c, var(--brass)); color:#1b1409; }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
.btn-secondary:hover{ border-color:var(--brass-dim); }
.btn-ghost{ background:transparent; color:var(--text-dim); border:1px dashed var(--line); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }

.tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card);
  padding:16px 14px; cursor:pointer; text-align:left; position:relative; overflow:hidden;
}
.tile:hover{ border-color:var(--brass-dim); }
.tile .ic{ font-size:22px; margin-bottom:22px; display:block; }
.tile .lbl{ font-weight:600; font-size:13.5px; display:block; }
.tile .sub{ color:var(--text-faint); font-size:11px; margin-top:2px; display:block; }
.tile.wide{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; }
.tile.wide .ic{ margin-bottom:0; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:16px; }
.divider{ height:1px; background:var(--line); margin:16px 0; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:600; }
.pill-local{ background:rgba(224,185,79,.14); color:#e0b94f; }
.pill-syncing{ background:rgba(95,169,224,.14); color:#5fa9e0; }
.pill-synced{ background:rgba(111,191,124,.14); color:var(--trace); }
.pill-hazard{ background:rgba(222,116,82,.16); color:var(--rust); }

/* camera / classify */
.cam-box{
  aspect-ratio:4/3; background:#0d1310 repeating-linear-gradient(45deg, #131c17 0 10px, #0d1310 10px 20px);
  border:1px solid var(--line); border-radius:var(--radius-card); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; margin-bottom:14px;
}
.cam-box video, .cam-box img{ width:100%; height:100%; object-fit:cover; }
.cam-placeholder{ color:var(--text-faint); font-size:12px; text-align:center; padding:20px; }
.scan-line{
  position:absolute; left:0; right:0; height:2px; background:var(--trace); box-shadow:0 0 10px var(--trace);
  animation:scan 1.1s ease-in-out infinite;
}
@keyframes scan{ 0%{top:6%} 50%{top:92%} 100%{top:6%} }

.material-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); }
.material-row:last-child{ border-bottom:none; }
.material-row.selected{ color:var(--brass); }
.material-name{ font-size:13.5px; }
.material-conf{ font-size:11px; color:var(--text-faint); }

.weight-stepper{ display:flex; align-items:center; gap:14px; justify-content:center; margin:6px 0 18px; }
.weight-stepper button{
  width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
  color:var(--text); font-size:19px; cursor:pointer;
}
.weight-value{ font-family:var(--font-head); font-size:30px; min-width:110px; text-align:center; }
.weight-value span{ font-size:14px; color:var(--text-faint); }

.price-hero{
  background:linear-gradient(160deg, rgba(205,159,69,.14), rgba(111,191,124,.06));
  border:1px solid var(--brass-dim); border-radius:var(--radius-card); padding:18px; text-align:center; margin-bottom:14px;
}
.price-hero .amount{ font-family:var(--font-head); font-size:34px; color:var(--brass); }
.price-hero .compare{ font-size:12px; color:var(--trace); margin-top:6px; }

.lot-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
.lot-item:last-child{ border-bottom:none; }
.lot-item .l-mat{ font-size:13.5px; font-weight:600; }
.lot-item .l-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.lot-item .l-val{ font-family:var(--font-head); font-size:15px; color:var(--brass); }

.recycler-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px; margin-bottom:10px; }
.recycler-card.top{ border-color:var(--brass); }
.recycler-head{ display:flex; justify-content:space-between; align-items:flex-start; }
.recycler-name{ font-weight:600; font-size:14px; }
.recycler-rank{ font-family:var(--font-head); font-size:11px; color:var(--brass); border:1px solid var(--brass-dim); padding:2px 7px; border-radius:var(--radius-pill); }
.recycler-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
.rstat{ font-size:10px; color:var(--text-faint); text-align:center; }
.rstat b{ display:block; color:var(--text); font-size:12.5px; font-weight:600; }

.lock-timer{ font-family:var(--font-head); font-size:38px; text-align:center; color:var(--brass); margin:8px 0 2px; }
.lock-bar{ height:5px; background:var(--panel-2); border-radius:var(--radius-pill); overflow:hidden; margin-bottom:16px; }
.lock-bar-fill{ height:100%; background:linear-gradient(90deg, var(--trace), var(--brass)); transition:width 1s linear; }

.qr-wrap{ display:flex; justify-content:center; margin:10px 0 16px; }
.qr-wrap canvas{ border-radius:6px; background:#fff; padding:10px; }

.weigh-compare{ display:flex; justify-content:space-between; gap:10px; margin-bottom:14px; }
.weigh-box{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:12px; text-align:center; }
.weigh-box .wl{ font-size:10.5px; color:var(--text-faint); margin-bottom:4px; }
.weigh-box .wv{ font-family:var(--font-head); font-size:19px; }

.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px; }
.stat-box .sv{ font-family:var(--font-head); font-size:22px; }
.stat-box .sl{ font-size:11px; color:var(--text-faint); margin-top:3px; }
.stat-box.accent .sv{ color:var(--brass); }
.stat-box.eco .sv{ color:var(--trace); }

.bar-compare{ margin-top:6px; }
.bar-row{ margin-bottom:10px; }
.bar-row .bl{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px; color:var(--text-dim); }
.bar-track{ height:9px; background:var(--panel-2); border-radius:var(--radius-pill); overflow:hidden; }
.bar-fill{ height:100%; border-radius:var(--radius-pill); }

.toast{
  position:absolute; left:16px; right:16px; bottom:78px; background:var(--panel-2); border:1px solid var(--brass-dim);
  color:var(--text); padding:12px 14px; border-radius:var(--radius-card); font-size:12.5px; z-index:20;
  box-shadow:0 12px 24px rgba(0,0,0,.4); animation:toastIn .25s ease;
}
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.back-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.back-btn{ background:none; border:none; color:var(--text-dim); font-size:19px; cursor:pointer; padding:0; }

.safety-row{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.safety-row:last-child{ border-bottom:none; }
.safety-ic{ font-size:20px; }
.safety-txt b{ display:block; font-size:13px; margin-bottom:2px; }
.safety-txt span{ font-size:11.5px; color:var(--text-faint); }

/* ============================= DESK CONSOLES (recycler/admin) ============================= */
.console{ flex:1; min-width:340px; }
.console-grid{ display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:start; }
.console-nav{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:10px; position:sticky; top:20px; }
.console-nav button{
  width:100%; text-align:left; background:none; border:none; color:var(--text-dim); padding:10px 12px;
  border-radius:var(--radius-card); font-size:13px; cursor:pointer; margin-bottom:2px; font-weight:500;
}
.console-nav button.active{ background:var(--panel-2); color:var(--brass); }
.console-main{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:22px; min-height:520px; }
.console-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:none; padding:8px 10px; border-bottom:1px solid var(--line); }
td{ padding:10px; border-bottom:1px solid var(--line); color:var(--text-dim); }
tr:last-child td{ border-bottom:none; }
.badge{ padding:2px 9px; border-radius:var(--radius-pill); font-size:10.5px; font-weight:600; }
.badge-verified{ background:rgba(111,191,124,.14); color:var(--trace); }
.badge-pending{ background:rgba(224,185,79,.14); color:#e0b94f; }
.badge-open{ background:rgba(222,116,82,.16); color:var(--rust); }
.badge-settled{ background:rgba(111,191,124,.14); color:var(--trace); }

.mini-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 12px; border-radius:var(--radius-card); font-size:11.5px; cursor:pointer; }
.mini-btn:hover{ border-color:var(--brass-dim); }

.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.kpi{ background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px; }
.kpi .kv{ font-family:var(--font-head); font-size:21px; }
.kpi .kl{ font-size:11px; color:var(--text-faint); margin-top:3px; }

.footnote{ color:var(--text-faint); font-size:12px; margin-top:30px; text-align:center; line-height:1.6; }

@media (max-width:900px){ .console-grid{ grid-template-columns:1fr; } .console-nav{ position:static; } }
@media (max-width:420px){ .phone{ width:100%; } }
</style>
</head>
<body>
<div class="traces"></div>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">TB</div>
      <div>
        <div class="brand-name">TrashBridge</div>
        <div class="brand-sub">Formal e-waste, from the kabadiwala up</div>
      </div>
    </div>
    <div class="persona-switch" id="personaSwitch">
      <button data-p="collector" class="active">Collector app</button>
      <button data-p="recycler">Recycler portal</button>
      <button data-p="admin">Admin desk</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="footnote">
    Interactive product demo — classification, pricing, matching and fraud scoring run on simulated data in your browser.<br>
    Backend contract (FastAPI + TOPSIS + IsolationForest) ships alongside this file; see <code>backend/README.md</code> to run it for real.
  </div>
</div>

<script>
/* =========================================================================
   TrashBridge demo — vanilla JS, single file.
   State lives in localStorage so a reload doesn't lose the collector's lots,
   mirroring the "offline-safe local lot" requirement in the brief.
   ========================================================================= */

const MATERIALS = {
  CRT_MONITOR:    { label:"CRT Monitor / TV",     rate:9,   hazard:"high",   icon:"📺" },
  LCD_LED_PANEL:  { label:"LCD / LED Panel",       rate:17,  hazard:"medium", icon:"🖥️" },
  PCB:            { label:"PCB / Circuit Board",   rate:245, hazard:"high",   icon:"🔌" },
  CABLES_WIRES:   { label:"Cables & Wires",        rate:142, hazard:"low",    icon:"🔗" },
  BATTERY:        { label:"Battery",               rate:44,  hazard:"high",  icon:"🔋" },
  MOTORS_MAGNETS: { label:"Motors & Magnets",      rate:196, hazard:"medium", icon:"🧲" },
  MIXED_PLASTICS: { label:"Mixed Plastics",        rate:13,  hazard:"low",   icon:"🧱" },
};
const MIDDLEMAN_DISCOUNT = 0.22;
const LOCK_WINDOW_SEC = 20 * 60;

const RECYCLERS = [
  { id:"r1", name:"GreenCycle Recyclers, Guindy", distance:3.2, rate:1.05, pickup:0.9, trust:0.92, verified:true },
  { id:"r2", name:"Tondiarpet E-Waste Hub",        distance:9.6, rate:0.95, pickup:0.6, trust:0.80, verified:true },
  { id:"r3", name:"Ambattur Metal Works",          distance:14.1,rate:1.10, pickup:0.75,trust:0.70, verified:true },
  { id:"r4", name:"EcoReborn Chennai",             distance:5.8, rate:1.00, pickup:0.85,trust:0.88, verified:true },
];

const SAFETY_TIPS = [
  { ic:"🧤", t:"Gloves for CRT & battery handling", d:"Lead glass and battery terminals can cut or leak — never handle bare-handed." },
  { ic:"😷", t:"Mask near broken CRT/LCD glass",     d:"Dust from cracked screens can contain phosphor and lead particulates." },
  { ic:"🚫", t:"Never puncture or burn batteries",   d:"Swelling or leaking batteries go straight into the sealed hazard bag." },
  { ic:"📦", t:"Keep PCBs dry and separate",         d:"Highest resale value in the whole lot — protect it from moisture and crushing." },
];

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtINR(n){ return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:0}); }
function fmtINR2(n){ return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:2}); }

/* ---------------------------- persisted state ---------------------------- */
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem("tb_state")) || null; }catch(e){ return null; } },
  save(s){ localStorage.setItem("tb_state", JSON.stringify(s)); }
};

let S = store.load() || {
  onboarded:false,
  name:"", phone:"", city:"Chennai", language:"en",
  lots:[],            // {id, material, weight, value, status: local|syncing|synced}
  batches:[],         // {id, lotIds, total, status, recyclerId, lockToken, lockExpires}
  ledger:[],          // {id, batchId, amount, ts}
  network:"online",   // online|offline (demo toggle)
  disputes:[],
  eprEntries:[],
  recyclerCerts: RECYCLERS.map(r=>({...r})),
};
function persist(){ store.save(S); }

let persona = "collector";
let collectorScreen = "home";
let flowData = {}; // scratch data for the in-progress lot / batch flow
let consoleTab = { recycler:"batches", admin:"directory" };

/* ============================================================ TOPSIS ============================================================ */
function topsis(rows, keys, weights, benefit){
  const m = rows.map(r=>keys.map(k=>r[k]));
  const norms = keys.map((_,j)=> Math.sqrt(m.reduce((s,row)=>s+row[j]*row[j],0)) || 1);
  const wm = m.map(row=>row.map((v,j)=> (v/norms[j]) * weights[j]));
  const best = keys.map((_,j)=> benefit[j] ? Math.max(...wm.map(r=>r[j])) : Math.min(...wm.map(r=>r[j])));
  const worst= keys.map((_,j)=> benefit[j] ? Math.min(...wm.map(r=>r[j])) : Math.max(...wm.map(r=>r[j])));
  const scored = rows.map((r,i)=>{
    const db = Math.sqrt(wm[i].reduce((s,v,j)=>s+(v-best[j])**2,0));
    const dw = Math.sqrt(wm[i].reduce((s,v,j)=>s+(v-worst[j])**2,0));
    const score = (db+dw)===0 ? 0 : dw/(db+dw);
    return {...r, score};
  });
  return scored.sort((a,b)=>b.score-a.score);
}

function screenLock(){
  const batch = S.batches.find(b=>b.id===flowData.batchId);
  if(!batch) return `<p class="scr-sub">No active lock.</p>`;
  const remaining = Math.max(0, Math.round((batch.lockExpires - Date.now())/1000));

  const mm = String(Math.floor(remaining/60)).padStart(2,"0");
  const ss = String(remaining%60).padStart(2,"0");
  const recycler = RECYCLERS.find(r=>r.id===batch.recyclerId);
  return `

  <p class="scr-sub">with ${recycler.name} · token ${batch.lockToken}</p>

    <div class="material-conf">If the window lapses, this batch returns to matching — never auto-honored stale.</div>

}

/* ============================================================ WIRE COLLECTOR EVENTS ============================================================ */
function wireCollector(){
  const scroll = document.getElementById("screenScroll");

  // onboarding
  if(!S.onboarded){
    let lang="hi";
    document.getElementById("ob-lang")?.addEventListener("click", e=>{
      const b=e.target.closest("button"); if(!b) return;
      lang=b.dataset.l;
      document.querySelectorAll("#ob-lang button").forEach(x=>x.classList.toggle("active", x===b));
    });
    document.getElementById("ob-submit")?.addEventListener("click", ()=>{
      const name = document.getElementById("ob-name").value.trim() || "Collector";
      const phone = document.getElementById("ob-phone").value.trim();
      const city = document.getElementById("ob-city").value;
      S.onboarded=true; S.name=name; S.phone=phone; S.city=city; S.language=lang;
      persist(); render();
    });
    return;
  }

  document.getElementById("netToggle")?.addEventListener("click", ()=>{
    S.network = S.network==="online" ? "offline" : "online";
    if(S.network==="online"){
      const pending = S.lots.filter(l=>l.status==="local");
      if(pending.length){ setTimeout(()=>{ pending.forEach(l=>l.status="local"); persist(); render(); }, 50); }
    }
    persist(); render();
  });

  document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click", ()=>{
    collectorScreen = b.dataset.tab; flowData={}; render();
  }));
  document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click", ()=>{
    collectorScreen = b.dataset.nav; flowData={}; render();
  }));
  document.getElementById("backBtn")?.addEventListener("click", ()=>{
    if(window.__lastBack) window.__lastBack();
    render();
  });

  // voice
  document.getElementById("speakRates")?.addEventListener("click", ()=>{
    speak(`Today's rates for ${S.city}. ` + Object.values(MATERIALS).map(m=>`${m.label}, ${m.rate} rupees per kilogram.`).join(" "));
  });
  document.getElementById("speakSafety")?.addEventListener("click", ()=>{
    speak(SAFETY_TIPS.map(t=>`${t.t}. ${t.d}`).join(" "));
  });

  // lot creator flow
  document.getElementById("lc-capture")?.addEventListener("click", ()=>{
    flowData.step="classify"; render();
    setTimeout(()=>{
      const keys = Object.keys(MATERIALS);
      flowData.guess = keys[Math.floor(Math.random()*keys.length)];
      flowData.material = flowData.guess;
      flowData.confidence = 0.82 + Math.random()*0.15;
      flowData.step="confirm"; render();
    }, 1100);
  });
  document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click", ()=>{
    flowData.material = b.dataset.pick; render();
  }));
  document.getElementById("lc-confirmMat")?.addEventListener("click", ()=>{
    flowData.weight = flowData.weight || 1.0; flowData.step="weight"; render();
  });
  document.querySelectorAll("[data-wstep]").forEach(b=>b.addEventListener("click", ()=>{
    flowData.weight = Math.max(0.1, +(flowData.weight + parseFloat(b.dataset.wstep)).toFixed(1)); render();
  }));
  document.getElementById("lc-toPrice")?.addEventListener("click", ()=>{ flowData.step="price"; render(); });
  document.getElementById("lc-save")?.addEventListener("click", ()=>{
    const mat = MATERIALS[flowData.material];
    S.lots.push({ id:uid(), material:flowData.material, weight:flowData.weight, value:+(mat.rate*flowData.weight).toFixed(2), status:"local" });
    persist();
    collectorScreen="lots"; flowData={}; render();
    showToast("Lot saved locally — will sync automatically once online.");
  });

  // sync
  document.getElementById("syncNow")?.addEventListener("click", ()=>{
    const pending = S.lots.filter(l=>l.status==="local");
    pending.forEach(l=>l.status="syncing"); persist(); render();
    setTimeout(()=>{
      const ids = pending.map(l=>l.id);
      pending.forEach(l=>l.status="synced");
      const total = pending.reduce((s,l)=>s+l.value,0);
      S.batches.push({ id:uid(), lotIds:ids, total:+total.toFixed(2), status:"synced", recyclerId:null, lockToken:null, lockExpires:null });
      persist(); render();
      showToast(`Batch synced — ${fmtINR(total)} across ${pending.length} lot(s).`);
    }, 900);
  });

  // recycler finder -> lock
  document.querySelectorAll("[data-lock]").forEach(b=>b.addEventListener("click", ()=>{
    const recyclerId = b.dataset.lock;
    const batch = S.batches.find(bt=>bt.status==="synced");
    if(!batch) return;
    batch.recyclerId = recyclerId;
    batch.lockToken = Math.random().toString(16).slice(2,8).toUpperCase();
    batch.lockExpires = Date.now() + LOCK_WINDOW_SEC*1000;
    batch.status="locked";
    persist();
    flowData.batchId = batch.id;
    collectorScreen="lock"; render();
    startLockTimer();
  }));

  if(collectorScreen==="lock") startLockTimer();

  document.getElementById("goHandover")?.addEventListener("click", ()=>{
    collectorScreen="handover"; flowData.otp = String(Math.floor(100000+Math.random()*900000));
    render();
  });

  if(collectorScreen==="handover"){
    drawQR(document.getElementById("qrCanvas"), flowData.otp || "TB-DEMO");
    document.querySelectorAll("[data-whstep]").forEach(b=>b.addEventListener("click", ()=>{
      const batch = S.batches.find(bt=>bt.id===flowData.batchId);
      const lots = S.lots.filter(l=>batch.lotIds.includes(l.id));
      const reported = lots.reduce((s,l)=>s+l.weight,0);
      flowData.weighbridge = Math.max(0, +((flowData.weighbridge ?? reported)+parseFloat(b.dataset.whstep)).toFixed(1));
      render();
    }));
    document.getElementById("otpInput")?.addEventListener("input", e=>{ flowData.otp = e.target.value.replace(/\D/g,"").slice(0,6); });
    document.getElementById("settleBtn")?.addEventListener("click", ()=>{
      const batch = S.batches.find(bt=>bt.id===flowData.batchId);
      const lots = S.lots.filter(l=>batch.lotIds.includes(l.id));
      const reported = lots.reduce((s,l)=>s+l.weight,0);
      const tol = Math.min(...lots.map(l=>({high:0.05,medium:0.08,low:0.15}[MATERIALS[l.material].hazard])));
      const within = Math.abs(flowData.weighbridge-reported)/reported <= tol;
      if(within){
        batch.status="settled";
        S.ledger.push({id:uid(), batchId:batch.id, amount:batch.total, ts:Date.now()});
        lots.forEach(l=>S.eprEntries.push({id:uid(), material:l.material, weight:l.weight, batchId:batch.id, ts:Date.now()}));
        persist();
        collectorScreen="ledger"; flowData={}; render();
        showToast("Payment released — locked digital receipt recorded to the EPR ledger.");
      } else {
        batch.status="disputed";
        S.disputes.push({id:uid(), batchId:batch.id, reason:"Weight mismatch at handover", status:"open", ts:Date.now()});
        persist();
        collectorScreen="home"; flowData={}; render();
        showToast("Out of tolerance — sent to dispute queue. Payment held, not lost.");
      }
    });
  }
}

let lockTimerHandle=null;
function startLockTimer(){
  clearInterval(lockTimerHandle);
  lockTimerHandle = setInterval(()=>{
    if(collectorScreen!=="lock"){ clearInterval(lockTimerHandle); return; }
    const scroll = document.getElementById("screenScroll");
    if(scroll) scroll.innerHTML = screenLock();
  }, 1000);
}

function speak(text){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = S.language==="hi" ? "hi-IN" : S.language==="mr" ? "mr-IN" : "en-IN";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function showToast(msg){
  const screen = document.querySelector(".phone-screen");
  if(!screen) return;
  const t = document.createElement("div");
  t.className="toast"; t.textContent=msg;
  screen.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

/* simple deterministic pixel-grid "QR" — visual stand-in, not a decodable code */
function drawQR(canvas, seedStr){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const n=12, cell=canvas.width/n;
  let seed=0; for(const c of seedStr) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
  function rand(){ seed = (seed*1664525+1013904223)>>>0; return seed/4294967295; }
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#131c17";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const inCorner = (x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
    if(inCorner){ if(x%2===0||y%2===0) ctx.fillRect(x*cell,y*cell,cell,cell); continue; }
    if(rand()>0.55) ctx.fillRect(x*cell,y*cell,cell,cell);
  }
}

/* ============================================================ RECYCLER CONSOLE ============================================================ */
function renderRecyclerConsole(){
  const tab = consoleTab.recycler;
  return `
  <div class="console">
    <div class="console-grid">
      <div class="console-nav">
        <button data-rtab="batches" class="${tab==='batches'?'active':''}">Incoming batches</button>
        <button data-rtab="weigh" class="${tab==='weigh'?'active':''}">Weighbridge entry</button>
        <button data-rtab="scan" class="${tab==='scan'?'active':''}">Handover scan</button>
        <button data-rtab="inventory" class="${tab==='inventory'?'active':''}">Inventory & history</button>
      </div>
      <div class="console-main">${recyclerTab(tab)}</div>
    </div>
  </div>`;
}
function recyclerTab(tab){
  if(tab==="batches"){
    const locked = S.batches.filter(b=>b.status==="locked"||b.status==="settled"||b.status==="disputed");
    return `<div class="console-header"><h3>Incoming batches</h3></div>
    <table><thead><tr><th>Batch</th><th>Lots</th><th>Value</th><th>Status</th></tr></thead><tbody>
    ${locked.length? locked.map(b=>`<tr><td>#${b.id}</td><td>${b.lotIds.length}</td><td>${fmtINR(b.total)}</td><td><span class="badge badge-${b.status==='settled'?'settled':b.status==='disputed'?'open':'pending'}">${b.status}</span></td></tr>`).join("")
      : `<tr><td colspan="4" style="text-align:center;color:var(--text-faint);">No batches locked with this recycler yet — lock one from the Collector app.</td></tr>`}
    </tbody></table>`;
  }
  if(tab==="weigh"){
    return `<div class="console-header"><h3>Weighbridge entry</h3></div>
    <p class="scr-sub">Enter the weighbridge reading against a locked batch — tolerance is checked automatically, tiered by material value (±5% PCB/battery, ±8% motors, ±15% mixed plastics/cables).</p>
    <div class="card">Switch to the Collector app tab to complete a handover — this console mirrors the same tiered-tolerance logic the backend enforces at <code>POST /api/handover</code>.</div>`;
  }
  if(tab==="scan"){
    return `<div class="console-header"><h3>Handover scan</h3></div>
    <p class="scr-sub">Recycler enters the OTP shown on the collector's phone (or scans the QR) to confirm physical custody transfer — works offline, verified on next sync.</p>
    <div class="field"><label>OTP from collector</label><input placeholder="6-digit code"/></div>
    <button class="btn btn-primary">Verify & confirm custody</button>`;
  }
  const settled = S.batches.filter(b=>b.status==="settled");
  return `<div class="console-header"><h3>Inventory & transaction history</h3></div>
  <table><thead><tr><th>Batch</th><th>Value</th><th>Settled</th></tr></thead><tbody>
  ${settled.length? settled.map(b=>`<tr><td>#${b.id}</td><td>${fmtINR(b.total)}</td><td><span class="badge badge-settled">paid</span></td></tr>`).join("")
    : `<tr><td colspan="3" style="text-align:center;color:var(--text-faint);">No settled transactions yet.</td></tr>`}
  </tbody></table>`;
}
function wireRecycler(){
  document.querySelectorAll("[data-rtab]").forEach(b=>b.addEventListener("click", ()=>{ consoleTab.recycler=b.dataset.rtab; render(); }));
}

/* ============================================================ ADMIN CONSOLE ============================================================ */
function renderAdminConsole(){
  const tab = consoleTab.admin;
  return `
  <div class="console">
    <div class="console-grid">
      <div class="console-nav">
        <button data-atab="directory" class="${tab==='directory'?'active':''}">Recycler directory</button>
        <button data-atab="live" class="${tab==='live'?'active':''}">Live transactions</button>
        <button data-atab="epr" class="${tab==='epr'?'active':''}">EPR compliance report</button>
        <button data-atab="disputes" class="${tab==='disputes'?'active':''}">Dispute & fraud queue</button>
        <button data-atab="prices" class="${tab==='prices'?'active':''}">Price data management</button>
      </div>
      <div class="console-main">${adminTab(tab)}</div>
    </div>
  </div>`;
}
function adminTab(tab){
  if(tab==="directory"){
    const rows = S.recyclerCerts.map(r=>`<tr><td>${r.name}</td><td>${r.distance} km</td><td><span class="badge ${r.verified?'badge-verified':'badge-pending'}">${r.verified?'verified':'pending'}</span></td>
      <td>${r.verified? "—" : `<button class="mini-btn" data-verify="${r.id}">Approve certificate</button>`}</td></tr>`).join("");
    return `<div class="console-header"><h3>Recycler directory</h3><span class="material-conf">Certificate verification is manual — no automated OCR/portal cross-check.</span></div>
    <table><thead><tr><th>Name</th><th>Distance</th><th>CPCB status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(tab==="live"){
    const kpi = kpis();
    const rows = S.batches.slice().reverse().map(b=>`<tr><td>#${b.id}</td><td>${fmtINR(b.total)}</td><td><span class="badge badge-${b.status==='settled'?'settled':b.status==='disputed'?'open':'pending'}">${b.status}</span></td></tr>`).join("")
      || `<tr><td colspan="3" style="text-align:center;color:var(--text-faint);">No transactions yet — create a lot in the Collector app.</td></tr>`;
    return `<div class="console-header"><h3>Live transactions</h3></div>
    <div class="kpi-row">
      <div class="kpi"><div class="kv">${kpi.settled}</div><div class="kl">Settled today</div></div>
      <div class="kpi"><div class="kv">${fmtINR(kpi.value)}</div><div class="kl">Value processed</div></div>
      <div class="kpi"><div class="kv">${kpi.disputes}</div><div class="kl">Open disputes</div></div>
      <div class="kpi"><div class="kv">${kpi.flagged}</div><div class="kl">Fraud-flagged</div></div>
    </div>
    <table><thead><tr><th>Batch</th><th>Value</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(tab==="epr"){
    const rows = S.eprEntries.slice().reverse().map(e=>`<tr><td>${MATERIALS[e.material].label}</td><td>${e.weight.toFixed(1)} kg</td><td>#${e.batchId}</td><td>${new Date(e.ts).toLocaleString()}</td></tr>`).join("")
      || `<tr><td colspan="4" style="text-align:center;color:var(--text-faint);">No append-only entries yet — settle a handover to generate one.</td></tr>`;
    return `<div class="console-header"><h3>EPR compliance report</h3><span class="material-conf">Append-only audit trail — never edited.</span></div>
    <table><thead><tr><th>Material</th><th>Weight</th><th>Batch</th><th>Recorded</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(tab==="disputes"){
    const rows = S.disputes.slice().reverse().map(d=>`<tr><td>#${d.batchId}</td><td>${d.reason}</td><td><span class="badge badge-open">${d.status}</span></td></tr>`).join("")
      || `<tr><td colspan="3" style="text-align:center;color:var(--text-faint);">Queue is empty.</td></tr>`;
    return `<div class="console-header"><h3>Dispute & fraud queue</h3><span class="material-conf">Fraud scoring flags for review — it never blocks a payment.</span></div>
    <table><thead><tr><th>Batch</th><th>Reason</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  const rows = Object.entries(MATERIALS).map(([k,m])=>`<tr><td>${m.icon} ${m.label}</td><td>${fmtINR(m.rate)}/kg</td><td>±${Math.round({high:5,medium:8,low:15}[m.hazard])}%</td><td>${m.hazard}</td></tr>`).join("");
  return `<div class="console-header"><h3>Price data management</h3></div>
  <table><thead><tr><th>Material</th><th>Base rate</th><th>Weight tolerance</th><th>Hazard tier</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function kpis(){
  const settled = S.batches.filter(b=>b.status==="settled");
  return {
    settled: settled.length,
    value: settled.reduce((s,b)=>s+b.total,0),
    disputes: S.disputes.filter(d=>d.status==="open").length,
    flagged: S.lots.filter(()=>false).length, // demo: no live fraud model client-side; backend exposes this via /api/lots
  };
}
function wireAdmin(){
  document.querySelectorAll("[data-atab]").forEach(b=>b.addEventListener("click", ()=>{ consoleTab.admin=b.dataset.atab; render(); }));
  document.querySelectorAll("[data-verify]").forEach(b=>b.addEventListener("click", ()=>{
    const r = S.recyclerCerts.find(x=>x.id===b.dataset.verify); if(r) r.verified=true; persist(); render();
  }));
}

render();
</script>
